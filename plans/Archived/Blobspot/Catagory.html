      // 初始化 jsTree
      $('#jstree').jstree({
        'core': {
          'data': data,
          'check_callback': true
        },
        'plugins': ["wholerow"]
      }).on('loaded.jstree', function () {
        expandToLevel(3);
      });

      // 點擊事件處理
      $('#jstree').on("select_node.jstree", function (e, data) {
        // 阻止默認事件
        e.preventDefault();
        
        var href = data.node.original.a_attr?.href;
        if (href) {
          window.open(href, '_blank');
        }
        // 取消選中狀態
        $('#jstree').jstree('deselect_node', data.node);
        return false;
      });

      // 展開全部
      $('#expand-all').on('click', function () {
        $('#jstree').jstree('open_all');
      });

      // 收合全部
      $('#collapse-all').on('click', function () {
        $('#jstree').jstree('close_all');
        expandToLevel(2);
      });

      // 展開到指定層級的函數
      function expandToLevel(maxLevel) {
        $('#jstree').jstree('get_json', '#').forEach(function expandNode(node, level) {
          if (level < maxLevel) {
            $('#jstree').jstree('open_node', node.id);
            if (node.children) {
              node.children.forEach(function (child) {
                expandNode(child, level + 1);
              });
            }
          }
        }, 0);
      }
    });
  </script>
